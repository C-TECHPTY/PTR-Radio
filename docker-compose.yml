services:
  ptr-radio:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ptr-radio-automation
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      PORT: 8091
      NODE_ENV: production
      DATABASE_PATH: ./database/ptr-radio.db
      AZURACAST_URL: ${AZURACAST_URL:-}
      AZURACAST_STATION_ID: ${AZURACAST_STATION_ID:-}
      AZURACAST_STATION_SHORT_NAME: ${AZURACAST_STATION_SHORT_NAME:-}
      AZURACAST_API_KEY: ${AZURACAST_API_KEY:-}
      ON_AIR_LIVE_NAME: ${ON_AIR_LIVE_NAME:-AzuraCast principal}
      ON_AIR_LIVE_HOST: ${ON_AIR_LIVE_HOST:-}
      ON_AIR_LIVE_PORT: ${ON_AIR_LIVE_PORT:-8000}
      ON_AIR_LIVE_MOUNT: ${ON_AIR_LIVE_MOUNT:-/}
      ON_AIR_LIVE_USERNAME: ${ON_AIR_LIVE_USERNAME:-source}
      ON_AIR_LIVE_PASSWORD_ENV: ${ON_AIR_LIVE_PASSWORD_ENV:-ON_AIR_LIVE_PASSWORD}
      ON_AIR_LIVE_PASSWORD: ${ON_AIR_LIVE_PASSWORD:-}
      ON_AIR_LIVE_CODEC: ${ON_AIR_LIVE_CODEC:-mp3}
      ON_AIR_LIVE_BITRATE: ${ON_AIR_LIVE_BITRATE:-128}
      ON_AIR_LIVE_SAMPLE_RATE: ${ON_AIR_LIVE_SAMPLE_RATE:-44100}
      ON_AIR_LIVE_CHANNELS: ${ON_AIR_LIVE_CHANNELS:-2}
      ON_AIR_LIVE_OUTPUT_ENABLED: ${ON_AIR_LIVE_OUTPUT_ENABLED:-false}
    volumes:
      - ptr-radio-data:/app/database

volumes:
  ptr-radio-data:
